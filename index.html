<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weiwei-hacking</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* 大頭照 / 品牌標誌 */
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            object-fit: cover;
            margin-bottom: 1.25rem;
            filter: grayscale(100%);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        /* 個人簡介 */
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        p.bio {
            color: #888888;
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* 連結按鈕列表 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 懸停效果：經典反白 */
        .link-card:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        /* 頁尾 */
        footer {
            margin-top: 3rem;
            color: #444444;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 替換成你的照片或頭像連結 -->
        <img class="profile-img" src="https://yt3.googleusercontent.com/siNSThGidzZzW3h9Zo2RPnbbiV3cl3YoPOTJt46W_V89BhjpNXMRJ92BXBRfooM4wKE0nX-oHg=s160-c-k-c0x00ffffff-no-rj" alt="Avatar">
        
        <!-- 個人名稱與簡介 -->
        <h1>weiwei-hacking</h1>
        <p class="bio">Video creator / Developer / Gamer <br> Focusing on python develop and good video content.</p>

        <!-- 連結樞紐區塊 -->
        <div class="links">
            <a href="https://github.com/weiwei-hacking" class="link-card" target="_blank" rel="noopener">
                GitHub Page
            </a>
            <a href="https://youtube.com/@weiwei_hacking" class="link-card" target="_blank" rel="noopener">
                YouTube
            </a>
            <a href="https://discord.gg/ycwdzMARP4" class="link-card" target="_blank" rel="noopener">
                Discord Server
            </a>
            <a href="https://t.me/weiwei_official" class="link-card" target="_blank" rel="noopener">
                Telegram Channel (Backup)
            </a>
            <a href="http://t.me/weiwei_hacking" class="link-card">
                Contact Me (Telegram)
            </a>
        </div>

        <footer>
            © 2026 weiwei-hacking. ALL RIGHTS RESERVED.
        </footer>
    </div>

</body>
</html>
