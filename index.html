<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>🚀 weiwei_hacking's Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .container {
      text-align: center;
      max-width: 800px;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    p {
      margin-bottom: 30px;
      font-size: 1.2em;
      color: #f3f4f6;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, background 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 1.5em;
    }
    .card p {
      margin: 0;
      font-size: 1em;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 weiwei_hacking's Hub</h1>
    <p>Welcome to my hub :D</p>
    <div class="menu">
      <a class="card" href="https://youtube.com/@weiwei_hacking" target="_blank">
        <h2>YouTube</h2>
        <p>Subscribe my channel</p>
      </a>
      <a class="card" href="https://discord.com/users/1009119210099716237" target="_blank">
        <h2>Discord</h2>
        <p>If you need any help please add my discord!</p>
      </a>
      <a class="card" href="https://e-z.bio/weiwei1337" target="_blank">
        <h2>EZ Bio</h2>
        <p>Check my bio from e-z.bio</p>
      </a>
      <a class="card" href="https://github.com/weiwei-hacking" target="_blank">
        <h2>Github</h2>
        <p>Check my github!</p>
      </a>
    </div>
  </div>
</body>
</html>
